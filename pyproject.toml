[project]
name = "auGIT"
version = "0.1.0"
description = "Append-only supply-chain audit log for GitHub, PyPI, and Maven"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Adrian Thees", email = "adrian.thees@t-online.de" }
]
requires-python = ">=3.14"
dependencies = [
    "jinja2>=3.1.6",
    "pydantic>=2.13.4",
    "tqdm>=4.67.1",
    "typer>=0.25.1",
]

[project.urls]
Repository = "https://github.com/adrianthees/auGIT"
Issues = "https://github.com/adrianthees/auGIT/issues"

[project.scripts]
augit = "augit:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.13",
]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = "--cov=augit --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
